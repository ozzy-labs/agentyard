name: canary

on:
  schedule:
    - cron: "0 3 * * 1" # 毎週月曜 03:00 UTC に実行
  workflow_dispatch: # 手動実行も可能

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # 失敗時の Issue 自動起票に必須

jobs:
  # 既存: 次期 Ubuntu LTS リリース候補（devel / rolling）を Docker で先回り検証
  canary-ubuntu-future:
    name: Canary (ubuntu:${{ matrix.ubuntu-tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu-tag: ["devel", "rolling"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build canary image (ubuntu:${{ matrix.ubuntu-tag }})
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: tests/integration/Dockerfile
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu-tag }}
          tags: agentyard-canary:${{ matrix.ubuntu-tag }}
          load: true
          cache-from: type=gha,scope=canary-${{ matrix.ubuntu-tag }}
          cache-to: type=gha,scope=canary-${{ matrix.ubuntu-tag }},mode=max

      - name: Run integration on ubuntu:${{ matrix.ubuntu-tag }}
        env:
          GITHUB_TOKEN_FOR_MISE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # devel / rolling are newer than the supported releases on purpose:
          # the canary checks the next Ubuntu ahead of time, so bypass the gate.
          docker run --rm -e "GITHUB_TOKEN=$GITHUB_TOKEN_FOR_MISE" \
            -e AGENTYARD_ALLOW_UNSUPPORTED=1 \
            agentyard-canary:${{ matrix.ubuntu-tag }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = "${{ matrix.ubuntu-tag }}";
            const date = new Date().toISOString().slice(0, 10);
            const { serverUrl, repo: { owner, repo }, runId } = context;
            const runUrl = `${serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            // title に日付を含めない: 含めると週次実行のたびに別 title となり
            // dedup が効かず同一原因の issue が毎週増殖する（#177〜#195 の 12 件）。
            // 原因ごとに 1 件へ集約し、再発は既存 issue へのコメントで記録する。
            const title = `Canary failure: ubuntu:${tag}`;
            const body = [
              `Canary workflow failed on \`ubuntu:${tag}\` on ${date}.`,
              ``,
              `**Run:** ${runUrl}`,
              ``,
              `## Triage checklist`,
              ``,
              `- [ ] apt package renamed / removed in this Ubuntu version`,
              `- [ ] Vendor apt repository does not support this codename yet (Docker, Azure CLI)`,
              `- [ ] Upstream tool breaking change (\`mise\`, \`ast-grep\`, \`yq\`, etc.)`,
              `- [ ] Agent installer behavior change (claude / codex / copilot / agy)`,
              `- [ ] Transient network issue — re-run \`gh workflow run canary.yaml\` to confirm`,
              ``,
              `## How to reproduce locally`,
              ``,
              `\`\`\`bash`,
              `./tests/integration/run.sh ${tag}`,
              `\`\`\``,
              ``,
              `Non-blocking: Canary failures do not gate main-line PRs.`,
            ].join("\n");

            // 同じ tag の Open Issue が既にあれば新規起票せずコメントで再発を記録
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "open",
                labels: "canary",
                per_page: 100,
              },
            );
            const duplicate = existing.find((issue) => issue.title === title);

            if (duplicate) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: duplicate.number,
                body: `${date} に再発しました。\n\n**Run:** ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["canary", "investigation-needed"],
              });
            }

  # Bare Ubuntu runner (non-WSL, non-container): install.sh install directly.
  canary-ubuntu-native:
    name: Canary (Ubuntu Server, native install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTYARD_ASSUME_YES: "1"
      AGENTYARD_OFFLINE: "1"
      AGENTYARD_WITH: agents-md
      CI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run install.sh install on bare ubuntu-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./install.sh install

      - name: Check tools from a login shell
        run: bash -l tests/integration/assert-tools.sh

      - name: doctor (exit 0/1/2)
        run: ./install.sh doctor || [ "$?" -le 2 ]

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const { serverUrl, repo: { owner, repo }, runId } = context;
            const runUrl = `${serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            // title に日付を含めない（理由は canary-ubuntu-future ジョブのコメント参照）
            const title = `Canary failure: Ubuntu Server (native)`;
            const body = [
              `Canary workflow failed on bare ubuntu-latest (non-WSL Linux) on ${date}.`,
              ``,
              `**Run:** ${runUrl}`,
              ``,
              `Non-blocking: Canary failures do not gate main-line PRs.`,
            ].join("\n");
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", labels: "canary", per_page: 100 },
            );
            const duplicate = existing.find((issue) => issue.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: duplicate.number,
                body: `${date} に再発しました。\n\n**Run:** ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body,
                labels: ["canary", "investigation-needed"],
              });
            }

  # macOS on GitHub-hosted Apple Silicon runners (Homebrew-based setup).
  # Hosted runners currently offer macOS 26 only; macOS 27 is covered by the
  # manual checklist (docs/manual-checklist.md) until a runner is available.
  canary-macos:
    name: Canary (macOS 26, native install)
    runs-on: macos-26
    timeout-minutes: 40
    env:
      AGENTYARD_ASSUME_YES: "1"
      AGENTYARD_OFFLINE: "1"
      AGENTYARD_WITH: agents-md
      CI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run install.sh install on macOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./install.sh install

      - name: Check tools from a login shell (zsh)
        shell: zsh -l {0}
        run: |
          for t in git-lfs gh jq rg tree fzf fd mise node pnpm uv claude codex copilot agy; do
            command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
          done
          echo "all tools found"

      - name: doctor (exit 0/1/2)
        run: ./install.sh doctor || [ "$?" -le 2 ]

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const { serverUrl, repo: { owner, repo }, runId } = context;
            const runUrl = `${serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            // title に日付を含めない（理由は canary-ubuntu-future ジョブのコメント参照）
            const title = `Canary failure: macOS`;
            const body = [
              `Canary workflow failed on macos-latest on ${date}.`,
              ``,
              `**Run:** ${runUrl}`,
              ``,
              `## Triage checklist`,
              ``,
              `- [ ] Homebrew formula / cask renamed or deprecated`,
              `- [ ] Agent installer behavior change (claude / codex / copilot / agy)`,
              `- [ ] macOS runner image upgrade broke a built-in tool`,
              ``,
              `Non-blocking: Canary failures do not gate main-line PRs.`,
            ].join("\n");
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", labels: "canary", per_page: 100 },
            );
            const duplicate = existing.find((issue) => issue.title === title);
            if (duplicate) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: duplicate.number,
                body: `${date} に再発しました。\n\n**Run:** ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body,
                labels: ["canary", "investigation-needed"],
              });
            }
