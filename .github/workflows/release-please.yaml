name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # artifact attestations (Sigstore)
  attestations: write

jobs:
  release-please:
    name: Run release-please
    runs-on: ubuntu-latest
    steps:
      # A release PR opened with GITHUB_TOKEN gets no CI: its pull_request runs
      # land in "Awaiting approval" (action_required) and a maintainer has to
      # click Approve every time. An App installation token makes the release PR
      # an ordinary PR, so lint / test-* run on it by themselves.
      #
      # One-time setup (maintainer):
      #   1. Create a GitHub App owned by ozzy-labs with repository permissions
      #      Contents: read and write, Pull requests: read and write,
      #      Issues: read and write (release-please labels its PRs).
      #   2. Install the App on ozzy-labs/agentyard.
      #   3. Repository variable RELEASE_APP_ID    = the App's App ID.
      #   4. Repository secret   RELEASE_APP_PRIVATE_KEY = the App's .pem.
      # Until the variable exists this step is skipped and the token falls back
      # to GITHUB_TOKEN, so releases keep working either way.
      - name: Mint a GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # Release 作成時のみ asset 添付ジョブをトリガー
      # release_created が true の場合 outputs.tag_name にタグ名 (vX.Y.Z) が入る
      # ----------------------------------------------------------------
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.release.outputs.release_created == 'true' }}

      # Release assets (ADR-0007 §8):
      #   agentyard.tar.gz(.sha256)  archive that install.sh downloads and verifies
      #   install.sh(.sha256)        entry point for releases/latest/download/install.sh
      # Both are covered by GitHub Artifact Attestations:
      #   gh attestation verify <file> --repo ozzy-labs/agentyard
      - name: Build release archive and checksums
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          git archive --format=tar.gz -o agentyard.tar.gz HEAD \
            install.sh scripts config LICENSE README.md README.ja.md
          sha256sum agentyard.tar.gz > agentyard.tar.gz.sha256
          sha256sum install.sh > install.sh.sha256
          cat agentyard.tar.gz.sha256 install.sh.sha256

      - name: Attest build provenance
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            agentyard.tar.gz
            install.sh

      - name: Attach assets to GitHub Release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            agentyard.tar.gz agentyard.tar.gz.sha256 \
            install.sh install.sh.sha256 \
            --clobber
