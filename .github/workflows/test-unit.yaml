name: test-unit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: BATS unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level so every `mise exec` step (not just mise-action setup) skips trivy.
    # trivy is only needed by the local pre-commit hook, so installing it here is
    # pure overhead. (This exclusion originally also worked around an attestation
    # 403 from aquasecurity's IP-allowlisted API; that is fixed at the config level
    # by `github_attestations = false` in .mise.toml, so only the perf reason remains.)
    env:
      MISE_DISABLE_TOOLS: "github:aquasecurity/trivy"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mise (provides bats + linters)
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run BATS unit tests
        run: mise exec -- bats tests/unit/
