[settings]
experimental = true
plugin_autoupdate_last_check_duration = "7d"
always_keep_download = false
always_keep_install = false

# aqua レジストリ経由のツールは、上流リリースとレジストリ追従のずれにより
# 任意の新バージョンが破綻し得るため、すべて具体パッチ版に明示ピンする。
# 更新は Renovate (mise manager) が自動 PR 化し、CI で検証する。
# core バックエンド（node, python）は対象外。
#
# 注意: install_* スクリプトも `mise use --global` を呼ぶが、
# install_dev_tools 末尾の `chezmoi apply` がこのファイルで global 設定を
# 上書きするため、グローバルに残すツールはここで明示的に列挙する必要がある。
# このファイルに無いツールは chezmoi apply 後に config から消える。
[tools]
node = "lts"
pnpm = "10.33.2"
python = "latest"
# uv は aqua レジストリの signer_workflow が astral-sh/uv の Immutable Release
# 移行 (0.11.0+) に追従していないため、github バックエンドに切替えて回避する。
# https://github.com/aquaproj/aqua-registry/blob/main/pkgs/astral-sh/uv/registry.yaml
"github:astral-sh/uv" = "0.11.9"
# trivy も aqua レジストリの signer_workflow が aquasecurity/trivy の Immutable
# Release 移行に追従していないため、github バックエンドに切替えて回避する。
# lefthook の pre-commit フックが `mise exec -- trivy ...` を呼ぶため、
# chezmoi apply 後も global config に残るよう必ずここで明示する。
#
# github_attestations = false / asset_pattern の理由はリポルート .mise.toml の
# 同項目コメントを参照（2 ファイルは必ず同じピン・同じオプションに保つ）。
"github:aquasecurity/trivy" = { version = "0.70.0", github_attestations = false, asset_pattern = '*{% if os() == "macos" or os() == "darwin" %}macOS{% else %}Linux{% endif %}-{% if arch() == "arm64" or arch() == "aarch64" %}ARM64{% else %}64bit{% endif %}.tar.gz' }
gitleaks = "8.30.1"
ast-grep = "0.42.1"
yq = "4.53.2"
chezmoi = "2.70.2"
just = "1.50.0"
zoxide = "0.9.9"
shellcheck = "0.11.0"
# zellij は opt-in multiplexer (scripts/lib/install-multiplexer.sh が
# INSTALL_ZELLIJ=1 のときに mise use --global で導入) だが、chezmoi apply 後も
# global config に残るよう必ずここで明示する (#149 で導入、#155 で修正)。
# aqua バックエンドで動作確認済み。
zellij = "0.44.3"
