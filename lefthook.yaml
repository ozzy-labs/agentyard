extends:
  - lefthook-base.yaml

# agentyard specific overrides on top of the shared base from commons.
#
# lefthook's extends merge has base-wins semantics: when a command key exists
# in both base and local, the base entry wins (verified with lefthook 2.1.6
# `lefthook dump`). To substitute a base command we mark it `skip: true`
# locally and add a replacement under a different key.
#
# Unpinning lefthook-base.yaml in .commons/sync.yaml lets future commons
# improvements (e.g. ozzy-labs/commons#117 mise-exec wrapping) flow in
# automatically; agentyard specific behavior stays here.
pre-commit:
  commands:
    # Substitute base `shell` with severity=warning. agentyard shell
    # scripts intentionally produce SC2088 (tilde-in-log) and other info-level
    # findings. See ozzy-labs/agentyard#6.
    #
    # `run:` here is a stub; lefthook validate requires it to be a string,
    # but at execution time base's `run:` wins via extends merge — and `skip`
    # short-circuits both before either runs.
    shell:
      run: "true"
      skip: true
    agentyard-shell:
      glob: "**/*.sh"
      run: mise exec -- shfmt -w {staged_files} && mise exec -- shellcheck --severity=warning {staged_files}
      stage_fixed: true
    # Substitute base `trivy` with --scanners vuln only. agentyard
    # has no package manifest, so trivy's secret scanner is redundant with
    # gitleaks. See ozzy-labs/agentyard#63.
    trivy:
      run: "true"
      skip: true
    agentyard-trivy:
      run: mise exec -- trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .

commit-msg:
  commands:
    # Substitute base `commitlint`: newer mise (aube-based npm: backend)
    # installs packages under <dir>/node_modules instead of
    # <dir>/lib/node_modules, and commitlint resolves `extends` relative to
    # the config file (NODE_PATH is ignored for ES modules). Generate a
    # temporary config whose `extends` points at the preset's entry file by
    # absolute path. Supports both layouts until commons ships a fix.
    commitlint:
      run: "true"
      skip: true
    agentyard-commitlint:
      run: |
        d="$(mise where npm:@commitlint/config-conventional 2>/dev/null)"
        preset=""
        for base in "$d/node_modules" "$d/lib/node_modules"; do
          f="$base/@commitlint/config-conventional/lib/index.js"
          if [ -f "$f" ]; then preset="$f"; break; fi
        done
        if [ -z "$preset" ]; then
          echo "commitlint: @commitlint/config-conventional not found (run: mise install)" >&2
          exit 1
        fi
        cfg_dir="$(mktemp -d)"
        trap 'rm -rf "$cfg_dir"' EXIT
        sed "s|\"@commitlint/config-conventional\"|\"$preset\"|" .commitlintrc.yaml >"$cfg_dir/commitlint.config.yaml"
        mise exec -- commitlint --config "$cfg_dir/commitlint.config.yaml" --edit {1}
